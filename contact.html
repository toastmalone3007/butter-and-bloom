<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butter &amp; Bloom | Contact</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-shell">

    <header class="site-header">
      <div class="fake-browser">
        <div class="browser-dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
      </div>

      <div class="hero-banner small-hero">
        <img src="images/pexels-thuan-34166345.jpg" alt="Warm bakery banner">
      </div>

      <div class="content-wrap">
        <div class="site-intro">
          <div class="title-row">
            <img src="images/AdobeStock_1713770613.png" alt="Butter and Bloom leaf logo" class="leaf-logo">
            <h1>butter &amp; bloom</h1>
          </div>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html"><i class="fa-solid fa-house"></i> home</a>
          <a href="story.html"><i class="fa-solid fa-book-open"></i> story</a>
          <a href="contact.html"><i class="fa-solid fa-envelope"></i> contact</a>
          <a href="sources.html"><i class="fa-solid fa-link"></i> sources</a>
        </nav>

        <form class="header-search" action="#" method="get" role="search">
          <label for="search-contact" class="visually-hidden">Search the site</label>
          <input type="search" id="search-contact" name="q" placeholder="search the site">
          <button type="submit">search</button>
        </form>
      </div>
    </header>

    <main class="content-wrap form-page">
      <section class="article-box">
        <h2>send us a little note</h2>
        <p>
          Share your favorite pastry, café recommendation, or article idea.
        </p>

        <form action="#" method="post" class="contact-form">
          <label for="name">name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">email</label>
          <input type="email" id="email" name="email" required>

          <label for="subject">subject</label>
          <input type="text" id="subject" name="subject">

          <label for="message">message</label>
          <textarea id="message" name="message" rows="7" required></textarea>

          <button type="submit">send message</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="content-wrap footer-inner">
        <p>butter &amp; bloom — pastry, coffee, and café culture</p>
      </div>
    </footer>

  </div>
</body>
</html>
